<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso a la plataforma — Logopedia Sant Genís</title>
<link rel="icon" type="image/svg+xml" href="img/icono.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="pagina-auth">
  <div class="caja-auth">
    <img src="img/icono.svg" alt="" style="height:56px;display:block;margin:0 auto 16px;">
    <h1>Acceso a la plataforma</h1>
    <div class="mensaje-error" id="msgError"></div>
    <form id="formLogin">
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-secundario" style="width:100%;">Iniciar sesión</button>
    </form>
    <p class="enlace-secundario">¿Todavía no tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    <p class="enlace-secundario"><a href="index.html">« Volver al sitio</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msgError');
  msg.style.display = 'none';

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    msg.textContent = error.message === 'Invalid login credentials'
      ? 'Correo o contraseña incorrectos.'
      : error.message;
    msg.style.display = 'block';
    return;
  }

  const perfil = await obtenerPerfil(data.user.id);
  if (!perfil) {
    msg.textContent = 'No se encontró tu perfil. Contacta con el centro.';
    msg.style.display = 'block';
    return;
  }
  redirigirSegunRol(perfil.rol);
});

// Si ya hay sesión activa, redirige directo a su portal.
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    const perfil = await obtenerPerfil(session.user.id);
    if (perfil) redirigirSegunRol(perfil.rol);
  }
})();
</script>

</body>
</html>
