<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi portal — ConsultaViva</title>
<link rel="icon" type="image/svg+xml" href="/img/icono.svg">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="barra-portal">
  <div class="marca"><img src="/img/icono-oscuro.svg" alt=""> ConsultaViva — Portal del paciente</div>
  <div>
    <span id="nombreUsuario" style="margin-right:16px;"></span>
    <button onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</div>

<div id="barraVistaAdmin"></div>

<div class="tabs-portal" id="tabsPacientes" style="display:none;"></div>

<div class="panel" id="panelPacientes">
  <div class="cargando">Cargando tu información…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-client.js"></script>
<script>
function badgeEstado(estado) {
  const mapa = { pendiente: 'badge-ambar', confirmada: 'badge-azul', realizada: 'badge-verde', cancelada: 'badge-rojo' };
  return `<span class="badge ${mapa[estado] || 'badge-gris'}">${estado}</span>`;
}

let contadorTarjetas = 0;

function renderRecurso(r) {
  if (r.tipo === 'tarjeta_nombrar') {
    const id = 'tj-' + (contadorTarjetas++);
    return `
      <div class="tarjeta-nombrar" style="margin-top:14px;text-align:center;border:1px solid var(--borde);border-radius:12px;padding:16px;">
        ${r.contenido_url ? `<img src="${urlAbsoluta(r.contenido_url)}" alt="" style="max-width:100%;max-height:180px;border-radius:8px;margin-bottom:10px;">` : ''}
        <div id="${id}-palabra" style="display:none;font-weight:700;font-size:1.1rem;color:var(--azul-oscuro);margin-bottom:6px;">${esc(r.titulo)}</div>
        <div class="fila-acciones" style="justify-content:center;">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('${id}-palabra').style.display='block';this.style.display='none';">¿Cómo se dice? Mostrar palabra</button>
          ${r.descripcion ? `<button type="button" class="btn btn-outline" onclick="document.getElementById('${id}-pista').style.display='block';this.style.display='none';">Ver pista</button>` : ''}
        </div>
        ${r.descripcion ? `<div id="${id}-pista" class="meta" style="display:none;margin-top:8px;">💡 ${esc(r.descripcion)}</div>` : ''}
      </div>`;
  }
  return `
    <div style="margin-top:10px;">
      <strong>${esc(r.titulo)}</strong> <span class="meta">(${r.tipo})</span>
      ${r.descripcion ? `<p class="meta">${esc(r.descripcion)}</p>` : ''}
      ${r.contenido_url ? `<a href="${urlAbsoluta(r.contenido_url)}" target="_blank" rel="noopener">Abrir recurso »</a>` : ''}
    </div>`;
}

function cambiarPaciente(id) {
  document.querySelectorAll('#tabsPacientes .tab-link').forEach(b => b.classList.toggle('activo', b.dataset.id === id));
  document.querySelectorAll('#panelPacientes [data-paciente]').forEach(el => el.classList.toggle('activo', el.dataset.paciente === id));
}

(async () => {
  const session = await exigirSesion();
  if (!session) return;
  const perfil = await obtenerPerfil(session.user.id);
  if (!perfil) return;
  if (perfil.rol !== 'cliente' && perfil.rol !== 'admin') { redirigirSegunRol(perfil.rol); return; }

  mostrarBarraVistaAdmin(perfil.rol, 'cliente', 'barraVistaAdmin');
  document.getElementById('nombreUsuario').textContent = perfil.nombre || perfil.email;

  const uid = session.user.id;
  const { data: pacientes, error } = await supabaseClient
    .from('pacientes')
    .select('*')
    .or(`tutor_id.eq.${uid},usuario_id.eq.${uid}`);

  const cont = document.getElementById('panelPacientes');
  cont.innerHTML = '';

  if (error) {
    cont.innerHTML = '<p>Ocurrió un error cargando tus datos. Inténtalo de nuevo más tarde.</p>';
    return;
  }

  if (!pacientes || pacientes.length === 0) {
    cont.innerHTML = '<h2>Bienvenido/a</h2><p>Todavía no hay ningún paciente vinculado a tu cuenta. Tu logopeda lo vinculará en cuanto empieces el tratamiento.</p>';
    return;
  }

  if (pacientes.length > 1) {
    const tabs = document.getElementById('tabsPacientes');
    tabs.style.display = 'flex';
    tabs.innerHTML = pacientes.map((p, i) => `<button class="tab-link ${i === 0 ? 'activo' : ''}" data-id="${p.id}" onclick="cambiarPaciente('${p.id}')">${esc(p.nombre)}</button>`).join('');
  }

  const hoy = fechaLocalISO(new Date());

  for (const [i, p] of pacientes.entries()) {
    const bloque = document.createElement('div');
    bloque.dataset.paciente = p.id;
    if (pacientes.length > 1) bloque.className = 'seccion-tab' + (i === 0 ? ' activo' : '');
    bloque.innerHTML = `<h2>${esc(p.nombre)}</h2>`;

    const { data: citas } = await supabaseClient
      .from('citas')
      .select('*')
      .eq('paciente_id', p.id)
      .gte('fecha', hoy)
      .neq('estado', 'cancelada')
      .order('fecha', { ascending: true })
      .limit(1);

    const proxima = citas && citas[0];
    const cajaCita = document.createElement('div');
    cajaCita.className = 'lista-item';
    cajaCita.innerHTML = proxima
      ? `<strong>Próxima cita</strong><div class="meta">${formatearFecha(proxima.fecha)} — ${proxima.hora} — ${proxima.modalidad === 'online' ? 'Online' : 'Presencial'}</div> ${badgeEstado(proxima.estado)}${proxima.modalidad === 'online' ? `<div style="margin-top:8px;"><a class="btn btn-outline" href="https://meet.jit.si/LogopediaSantGenis-${proxima.id}" target="_blank" rel="noopener">📹 Unirse a la videollamada</a></div>` : ''}`
      : `<strong>Próxima cita</strong><div class="meta">Todavía no hay una cita agendada.</div>`;
    bloque.appendChild(cajaCita);

    const { data: recursosHab } = await supabaseClient
      .from('recursos_habilitados')
      .select('fecha, recursos(*)')
      .eq('paciente_id', p.id);

    const tituloRecursos = document.createElement('h3');
    tituloRecursos.textContent = 'Recursos para ti';
    tituloRecursos.style.marginTop = '20px';
    bloque.appendChild(tituloRecursos);

    if (!recursosHab || recursosHab.length === 0) {
      const vacio = document.createElement('p');
      vacio.className = 'vacio-panel';
      vacio.textContent = 'Tu logopeda todavía no ha habilitado recursos para ti.';
      bloque.appendChild(vacio);
    } else {
      const porCategoria = {};
      for (const rh of recursosHab) {
        if (!rh.recursos) continue;
        const cat = rh.recursos.categoria || 'General';
        (porCategoria[cat] = porCategoria[cat] || []).push(rh.recursos);
      }
      const gridRecursos = document.createElement('div');
      gridRecursos.className = 'grid-2';
      gridRecursos.style.maxWidth = 'none';
      gridRecursos.style.margin = '0';
      for (const cat of Object.keys(porCategoria)) {
        const catDiv = document.createElement('div');
        catDiv.className = 'tarjeta';
        catDiv.innerHTML = `<span class="etiqueta-pill">${esc(cat)}</span>` +
          porCategoria[cat].map(r => renderRecurso(r)).join('');
        gridRecursos.appendChild(catDiv);
      }
      bloque.appendChild(gridRecursos);
    }

    const { data: fichas } = await supabaseClient
      .from('fichas_seguimiento')
      .select('*')
      .eq('paciente_id', p.id)
      .eq('visible_para_cliente', true)
      .order('fecha', { ascending: false });

    const tituloSeg = document.createElement('h3');
    tituloSeg.textContent = 'Seguimiento';
    tituloSeg.style.marginTop = '20px';
    bloque.appendChild(tituloSeg);

    if (!fichas || fichas.length === 0) {
      const vacio = document.createElement('p');
      vacio.className = 'vacio-panel';
      vacio.textContent = 'Todavía no hay notas de seguimiento compartidas.';
      bloque.appendChild(vacio);
    } else {
      for (const f of fichas) {
        const item = document.createElement('div');
        item.className = 'lista-item';
        item.innerHTML = `<div class="meta">${formatearFecha(f.fecha)}</div><p>${esc(f.notas || '')}</p>`;
        bloque.appendChild(item);
      }
    }

    const { data: bonos } = await supabaseClient
      .from('bonos_sesiones')
      .select('*, tratamientos(nombre)')
      .eq('paciente_id', p.id)
      .eq('estado', 'activo');

    if (bonos && bonos.length) {
      const tituloBonos = document.createElement('h3');
      tituloBonos.textContent = 'Bonos de sesiones';
      tituloBonos.style.marginTop = '20px';
      bloque.appendChild(tituloBonos);
      for (const b of bonos) {
        const item = document.createElement('div');
        item.className = 'lista-item';
        item.innerHTML = `<strong>${esc(b.tratamientos?.nombre || 'Bono')}</strong><div class="meta">${b.sesiones_totales - b.sesiones_usadas} de ${b.sesiones_totales} sesiones restantes</div>`;
        bloque.appendChild(item);
      }
    }

    const { data: documentos } = await supabaseClient
      .from('documentos_paciente')
      .select('*')
      .eq('paciente_id', p.id)
      .eq('visible_para_cliente', true)
      .order('created_at', { ascending: false });

    const tituloDoc = document.createElement('h3');
    tituloDoc.textContent = 'Documentos';
    tituloDoc.style.marginTop = '20px';
    bloque.appendChild(tituloDoc);

    if (!documentos || documentos.length === 0) {
      const vacio = document.createElement('p');
      vacio.className = 'vacio-panel';
      vacio.textContent = 'Todavía no hay documentos compartidos contigo.';
      bloque.appendChild(vacio);
    } else {
      for (const d of documentos) {
        const item = document.createElement('div');
        item.className = 'lista-item';
        item.innerHTML = `<strong>${esc(d.titulo)}</strong> <span class="etiqueta-pill">${d.tipo}</span><div class="meta">${formatearFecha(d.created_at)}</div><a href="#" data-ruta="${d.storage_path}">Abrir »</a>`;
        item.querySelector('a').addEventListener('click', async (e) => {
          e.preventDefault();
          const { data } = await supabaseClient.storage.from('documentos-pacientes').createSignedUrl(d.storage_path, 60);
          if (data?.signedUrl) window.open(data.signedUrl, '_blank', 'noopener');
        });
        bloque.appendChild(item);
      }
    }

    cont.appendChild(bloque);
  }
})();
</script>

</body>
</html>
